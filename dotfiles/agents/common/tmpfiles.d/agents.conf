# Per-agent scratch dirs on the user runtime tmpfs — the exemption target of
# hooks/rules.json (reads and writes); /tmp is not exempt for agents. logind
# wipes $XDG_RUNTIME_DIR at session end, so no age-based cleanup.
d   {{@@ env['XDG_RUNTIME_DIR'] @@}}/claude   0700   {{@@ env['USER'] @@}}   {{@@ env['USER'] @@}}   -
d   {{@@ env['XDG_RUNTIME_DIR'] @@}}/codex    0700   {{@@ env['USER'] @@}}   {{@@ env['USER'] @@}}   -
d   {{@@ env['XDG_RUNTIME_DIR'] @@}}/cursor   0700   {{@@ env['USER'] @@}}   {{@@ env['USER'] @@}}   -
d   {{@@ env['XDG_RUNTIME_DIR'] @@}}/pi       0700   {{@@ env['USER'] @@}}   {{@@ env['USER'] @@}}   -
