[[install]]
id = 'agents-codex-hooks-json'
dst = '~/.codex/hooks.json'
path = 'codex/hooks.json'
capabilities = ['develop']
planes = ['user']

# --- cursor ------------------------------------------------------------------

[[install]]
id = 'agents-cursor-agreement'
dst = '~/.cursor/AGENTS.md'
path = 'prompts/AGENTS.md'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-cursor-agents'
dst = '~/.cursor/agents/'
path = 'prompts/agents'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-cursor-commands'
dst = '~/.cursor/commands/'
path = 'prompts/commands'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-cursor-craft'
dst = '~/.cursor/craft/'
path = 'prompts/craft'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-cursor-hooks-core'
dst = '~/.cursor/hooks/'
path = 'hooks'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-cursor-hooks-guard'
dst = '~/.cursor/hooks/guard.ts'
