# --- shared skills (codex / cursor / pi) ---------------------------------------------------
# The cross-tool skills location: Codex, Cursor, and pi all discover ~/.agents/skills/.
# Claude Code does not -- it keeps its own entry below.

[[install]]
id = 'agents-skills'
dst = '~/.agents/skills/'
path = 'prompts/skills'
capabilities = ['develop']
planes = ['user']

# --- claude-code -------------------------------------------------------------

[[install]]
id = 'agents-claude-agreement'
dst = '~/.claude/CLAUDE.md'
path = 'prompts/AGENTS.md'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-claude-agents'
dst = '~/.claude/agents/'
path = 'prompts/agents'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-claude-commands'
dst = '~/.claude/commands'
path = 'claude/commands'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-claude-craft'
dst = '~/.claude/craft/'
path = 'prompts/craft'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-claude-skills'
dst = '~/.claude/skills/'
path = 'prompts/skills'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-claude-settings'
dst = '~/.claude.json'
path = 'claude/claude.json'
capabilities = ['develop']
requires_overlays = ['personal']
planes = ['user']
chmod = '600'

[[install]]
id = 'agents-claude-hooks-core'
dst = '~/.claude/hooks/'
path = 'hooks'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-claude-hooks-guard'
dst = '~/.claude/hooks/guard.ts'
path = 'claude/hooks/guard.ts'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-claude-settings-hooks'
dst = '~/.claude/settings.json'
path = 'claude/settings.json'
capabilities = ['develop']
planes = ['user']

