# --- pi ----------------------------------------------------------------------

[[install]]
id = 'agents-pi-agreement'
dst = '~/.config/pi/agent/AGENTS.md'
path = 'prompts/AGENTS.md'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-pi-craft'
dst = '~/.config/pi/agent/craft/'
path = 'prompts/craft'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-pi-research'
dst = '~/.config/pi/agent/prompts'
path = 'prompts/commands'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'agents-pi-settings'
dst = '~/.config/pi/agent'
path = 'pi'
capabilities = ['develop']
requires_overlays = ['personal']
planes = ['user']
actions = ['pi-packages-install']

[[install]]
id = 'agents-pi-hooks-core'
dst = '~/.config/pi/agent/hooks/'
path = 'hooks'
capabilities = ['develop']
planes = ['user']

# --- per-agent scratch (cross-tool) -----------------------------------------------------------

# The scratch dirs every tool's guard exempts (hooks/rules.json); tmpfiles
# creates them on the user runtime tmpfs at login.

[[install]]
id = 'agents-tmpfiles'
dst = '~/.config/user-tmpfiles.d/'
path = 'tmpfiles.d'
capabilities = ['develop']
planes = ['user']

[actions]
pi-packages-install = 'pi update --extensions'
