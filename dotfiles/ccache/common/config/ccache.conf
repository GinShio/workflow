# Performance Optimization
compression = true
compression_level = 5
inode_cache = true

# Hit Rate Optimization
# Ignore locale and time macros (__DATE__, __TIME__)
sloppiness = locale,time_macros
# Build directories are keyed by branch and worktree, and CMake passes absolute
# source and include paths, so without this every new checkout compiles cold.
# Debug builds still hash the working directory into their entries.
base_dir = {{@@ projects.root_dir @@}}
# base_dir leaves diagnostics relative to the build directory, which
# `cmake --build` never announces. ccache resolves them against the build that
# prints them, output replayed from the cache included; a compiler flag such as
# clang's -fdiagnostics-absolute-paths would replay the first checkout's path.
absolute_paths_in_stderr = true

max_files = 0
max_size = {{@@ ((compiler_cache_max_bytes|float) / 1024 / 1024)|int @@}}MiB
{%@@ if ccache_remote_enabled @@%}
remote_only = false
remote_storage = file://{{@@ ccache.remote_dir @@}}|layout=subdirs
{%@@ endif @@%}
temporary_dir = {{@@ ccache.tmp_dir @@}}
