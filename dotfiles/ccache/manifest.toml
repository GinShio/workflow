# Shared as bytes so every cache backend consumes the same capacity.

[[install]]
id = 'ccache-config'
dst = '~/.config/ccache/'
path = 'config'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'ccache-tmpfiles'
dst = '~/.config/user-tmpfiles.d/'
path = 'tmpfiles.d'
capabilities = ['develop']
planes = ['user']

[dynvariables]
compiler_cache_max_bytes = """df -Pk / | awk 'NR == 2 { printf "%.0f\\n", $2 * 1024 * 0.2 }'"""

[variables.ccache]
runtime_dir = "{{@@ env['XDG_RUNTIME_DIR'] @@}}/ccache"
remote_dir = '{{@@ ccache.runtime_dir @@}}/remote'
tmp_dir = '{{@@ ccache.runtime_dir @@}}/tmp'
