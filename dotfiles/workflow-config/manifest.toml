[[install]]
id = 'workflow-config'
dst = '~/.config/workflow/gputest/'
path = 'gputest/'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'workflow-tmpfiles'
dst = '~/.config/user-tmpfiles.d/workflow.conf'
path = 'tmpfiles.conf'
capabilities = ['develop']
planes = ['user']

[dynvariables]
gputest_max_jobs = """n=$(lscpu -p=CORE,SOCKET 2>/dev/null | awk -F, '!/^#/ { seen[$1 FS $2] = 1 } END { print length(seen) }'); if [ "${n:-0}" -gt 0 ]; then printf '%s\\n' "$n"; else getconf _NPROCESSORS_ONLN; fi"""
