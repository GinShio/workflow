[drivers.radv]
layout = "mesa"
root = "{{env.HOME}}/.local"
env = { VK_DRIVER_FILES = "{{root}}/share/vulkan/icd.d/radeon_icd.x86_64.json", RADV_DEBUG = "nocache", VK_LOADER_DRIVERS_DISABLE = "*amd*,*lvp*" }

[drivers.lvp]
layout = "mesa"
root = "{{env.HOME}}/.local"
env = { VK_DRIVER_FILES = "{{root}}/share/vulkan/icd.d/lvp_icd.x86_64.json", VK_LOADER_DRIVERS_DISABLE = "*amd*,*radeon*" }

[drivers.amdvlk]
layout = "amdvlk"
# AMDVLK installs into its own prefix, the release build of its main branch
# that update-projects makes (`install`, not `install-local`).
root = "{{@@ projects.root_dir @@}}/{{@@ wits.projects.source_info['amdvlk'].org @@}}/{{@@ wits.projects.source_info['amdvlk'].name @@}}/_build/amd_stg_llpc-release"
env = { VK_DRIVER_FILES = "{{root}}/vulkan/icd.d/amd_icd64.json", VK_LOADER_DRIVERS_DISABLE = "*lvp*,*radeon*" }

[backends.zink]
env = { MESA_LOADER_DRIVER_OVERRIDE = "zink", __GLX_FORCE_VENDOR_LIBRARY_0 = "mesa" }

[backends.rusticl]
env = { RUSTICL_ENABLE = "zink", OCL_ICD_VENDORS = "{{root}}/etc/OpenCL/vendors" }

[backends.llvmpipe]
env = { MESA_LOADER_DRIVER_OVERRIDE = "swrast", LIBGL_ALWAYS_SOFTWARE = "1" }
