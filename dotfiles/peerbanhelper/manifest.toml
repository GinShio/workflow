# Consumes qbittorrent.port and qbittorrent_secret_key from the qbittorrent module.

[[install]]
id = 'peerbanhelper'
dst = '~/.local/share/PeerBanHelper/config'
path = '.'
capabilities = ['develop']
planes = ['user']

[variables.peerbanhelper]
port = 16002

[dynvariables]
peerbanhelper_secret_key = """python3 "{{@@ projects.script_dir @@}}/scripts/credential-state.py" secret "{{@@ env['HOME'] @@}}/.local/state/dotfiles/peerbanhelper_secret_key""""
