# Consumes qbittorrent.port and qbittorrent_secret_key from the qbittorrent module.

[[install]]
id = 'peerbanhelper'
dst = '~/.local/share/PeerBanHelper/config/'
path = '.'
capabilities = ['develop']
planes = ['user']

[variables.peerbanhelper]
port = 16002

[dynvariables]
peerbanhelper_secret_key = """f="{{@@ env['HOME'] @@}}/.local/state/dotfiles/peerbanhelper_secret_key"; mkdir -p "$(dirname "$f")"; [ -f "$f" ] && cat "$f" || openssl rand -hex 12 | tee "$f""""
