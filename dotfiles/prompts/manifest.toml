# --- cursor -----------------------------------------------------------------

[[install]]
id = 'prompts-cursor-agents'
dst = '~/.cursor/agents/'
path = 'agents'
capabilities = ['develop']
planes = ['user']
link = 'absolute'

[[install]]
id = 'prompts-cursor-skills'
dst = '~/.cursor/skills/'
path = 'skills'
capabilities = ['develop']
planes = ['user']
link = 'absolute'

[[install]]
id = 'prompts-cursor-commands'
dst = '~/.cursor/commands/'
path = 'commands'
capabilities = ['develop']
planes = ['user']
link = 'absolute'

[[install]]
id = 'prompts-cursor-craft'
dst = '~/.cursor/craft/'
path = 'craft'
capabilities = ['develop']
planes = ['user']
link = 'absolute'

[[install]]
id = 'prompts-cursor-memory'
dst = '~/.cursor/AGENTS.md'
path = 'AGENTS.md'
capabilities = ['develop']
planes = ['user']
link = 'absolute'

