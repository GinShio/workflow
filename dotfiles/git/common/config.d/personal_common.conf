# -*- mode: gitconfig; coding: utf-8; indent-tabs-mode: nil; -*-

[core]
        # Set the path to the directory containing git hooks
        hooksPath = {{@@ _dotdrop_dotpath @@}}/git/hooks

[user]
        # Set the user name for commits
        name = GinShio
        # Set the user email for commits
        email = ginshio78@gmail.com

[wits "hooks.pre-commit"]
        # Format the whole staged C/C++ file rather than only the commit's diff
        # window. Right where the tree is mine and already consistent; wrong on an
        # upstream tree, where it would bury the change under thousands of
        # untouched lines.
        format-clang-whole-file-enable = true
