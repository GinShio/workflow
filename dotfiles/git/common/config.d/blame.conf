# -*- mode: gitconfig; coding: utf-8; indent-tabs-mode: nil; -*-
[blame]
        # Use repository-specific ignored revisions when the file exists
        ignoreRevsFile = :(optional).git-blame-ignore-revs
        # Mark lines attributed to another commit after ignoring a revision
        markIgnoredLines = true
        # Mark lines that could not be attributed past an ignored revision
        markUnblamableLines = true
