# -*- mode: gitconfig; coding: utf-8; indent-tabs-mode: nil; -*-
[rebase]
        # Automatically squash fixup and squash commits during rebase
        autoSquash = true
        # Automatically stash and unstash changes during rebase
        autoStash = true
        # Require an explicit drop command when removing commits from the todo
        missingCommitsCheck = error
        # Move intermediate branch tips when rebasing a stack from its tip
        # Git skips branches checked out in other worktrees (git-rebase(1))
        updateRefs = true
