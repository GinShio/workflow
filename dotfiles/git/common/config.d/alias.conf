# -*- mode: gitconfig; coding: utf-8; indent-tabs-mode: nil; -*-
[alias]
        # Run Wits stack operations through git
        stack = !{{@@ sysenv.xdg_bin_home @@}}/wits-stack
        # Run Wits reviews through git
        review = !{{@@ sysenv.xdg_bin_home @@}}/wits-review
        # Run Wits transparent encryption through git
        transcrypt = !{{@@ sysenv.xdg_bin_home @@}}/wits-transcrypt
        # Absorb staged changes into any commit of the stack, down to the merge
        # target. Without --base, git-absorb hides every commit another local
        # branch reaches, which in a stack is every branch below this one.
        # Extra arguments pass through, e.g. --and-rebase.
        absorb-stack = "!f() { t=$(git symbolic-ref -q --short refs/remotes/upstream/HEAD || git symbolic-ref -q --short refs/remotes/origin/HEAD) || { echo 'absorb-stack: no merge target; run git remote set-head <remote> -a' >&2; return 1; }; b=$(git merge-base HEAD \"$t\") && git absorb --base \"$b\" \"$@\"; }; f"
