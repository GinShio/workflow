# -*- mode: gitconfig; coding: utf-8; indent-tabs-mode: nil; -*-
[alias]
        # Run Wits stack operations through git
        stack = !{{@@ sysenv.xdg_bin_home @@}}/wits-stack
        # Run Wits reviews through git
        review = !{{@@ sysenv.xdg_bin_home @@}}/wits-review
        # Run Wits transparent encryption through git
        transcrypt = !{{@@ sysenv.xdg_bin_home @@}}/wits-transcrypt
        # Absorb staged changes into any commit of the stack, down to the trunk
        # wits resolves for this checkout, the one its stacks are based on.
        # Without --base, git-absorb hides every commit another local branch
        # reaches, which in a stack is every branch below this one. Extra
        # arguments pass through, e.g. --and-rebase.
        absorb-stack = "!f() { t=$({{@@ sysenv.xdg_bin_home @@}}/wits __trunk --rev) && b=$(git merge-base HEAD \"$t\") && git absorb --base \"$b\" \"$@\"; }; f"
