# -*- mode: gitconfig; coding: utf-8; indent-tabs-mode: nil; -*-
[maintenance]
        # Use Git's task defaults; see git-config(1), maintenance.strategy
        strategy = geometric

[maintenance "prefetch"]
        # Geometric's task defaults omit prefetch; keep a daily fetch explicit
        # https://github.com/git/git/blob/v2.55.0/builtin/gc.c#L1894
        enabled = true
        schedule = daily
