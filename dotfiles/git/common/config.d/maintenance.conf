# -*- mode: gitconfig; coding: utf-8; indent-tabs-mode: nil; -*-
[maintenance]
        # Enable automatic maintenance tasks in the background
        # This allows Git to perform maintenance operations like garbage collection,
        # commit graph updates, and prefetching without manual intervention
        auto = true

[maintenance "commit-graph"]
        enabled = true
        schedule = daily

[maintenance "gc"]
        enabled = true
        schedule = daily

[maintenance "prefetch"]
        enabled = true
        schedule = daily

[maintenance "loose-objects"]
        enabled = true
        schedule = weekly

[maintenance "pack-refs"]
        enabled = true
        schedule = weekly
