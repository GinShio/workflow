[[install]]
id = 'qbittorrent-config'
dst = '~/.config/qBittorrent/'
path = 'config'
capabilities = ['develop']
planes = ['user']

[[install]]
id = 'qbittorrent-desktop'
dst = '~/.local/share/applications/'
path = 'desktop'
capabilities = ['desktop']
planes = ['user']

[[install]]
id = 'qbittorrent-service'
dst = '~/.config/systemd/user/'
path = 'service'
capabilities = ['develop']
planes = ['user']

[variables.qbittorrent]
port = 16001

[dynvariables]
qbittorrent_bin = 'command -v qbittorrent-nox 2>/dev/null || echo /usr/bin/qbittorrent-nox'
qbittorrent_secret_key = """python3 "{{@@ projects.script_dir @@}}/scripts/credential-state.py" secret "{{@@ env['HOME'] @@}}/.local/state/dotfiles/qbittorrent_secret_key""""
qbittorrent_secret_key_encode = """python3 "{{@@ projects.script_dir @@}}/scripts/credential-state.py" qbittorrent-hash "{{@@ env['HOME'] @@}}/.local/state/dotfiles/qbittorrent_secret_key" "{{@@ env['HOME'] @@}}/.local/state/dotfiles/qbittorrent_secret_key_encode""""
