[project]
org = "{{@@ wits.projects.source_info['mesa'].org @@}}"
build_system = "meson"
generator = "ninja"
toolchain = "clang"
default_presets = ["common"]

[repos.main]
path = "{{@@ projects.root_dir @@}}/{{project.org}}/{{project.name}}"
build_dir = "{{repos.main.workdir}}/_build/{{branch.slug}}-{{build_type}}"
install_dir = "{{build_dir}}"
main_branch = "main"
[repos.main.remotes]
upstream = "https://gitlab.freedesktop.org/mesa/mesa.git"
origin = "https://gitlab.freedesktop.org/GinShio/mesa.git"

[project.presets.common.definitions]
gallium-drivers = "radeonsi,zink,llvmpipe"
vulkan-drivers = "amd,swrast"
gallium-rusticl = true

# Meson's own devenv (meson.add_devenv) already points a program at this build's
# drivers, libraries and drirc; these are the knobs a test run adds on top. The
# lists append, so flags already in the caller's environment are kept.
[project.devenv]
MESA_SHADER_CACHE_DISABLE = "true"
RADV_DEBUG = { append = "nocache", separator = "," }
RUSTICL_ENABLE = { append = "zink", separator = "," }
