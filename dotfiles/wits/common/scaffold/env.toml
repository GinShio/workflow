# Where the specifications live on this machine.
#
# One name per source, spelled the same here, in the module that reads it, and on
# the command line. Each can be overridden per run:
#   --spv-grammar FILE   --spv-spec DIR   --vk-registry FILE

[source]
spv_grammar = "{{@@ projects.root_dir @@}}/{{@@ wits.projects.source_info['spirv-headers'].org @@}}/{{@@ wits.projects.source_info['spirv-headers'].name @@}}/include/spirv/unified1/spirv.core.grammar.json"
spv_spec = "{{@@ projects.root_dir @@}}/{{@@ wits.projects.source_info['spirv-registry'].org @@}}/{{@@ wits.projects.source_info['spirv-registry'].name @@}}/extensions"
vk_registry = "{{@@ projects.root_dir @@}}/{{@@ wits.projects.source_info['vulkan-registry'].org @@}}/{{@@ wits.projects.source_info['vulkan-registry'].name @@}}/xml/vk.xml"
