# A case is the driver × suite pair that names the store directory, the state
# file and the comparison against the previous archive. Which cases run
# nightly is a services declaration (`gpu-test-run.cases`); the config only
# says what a case is.

[case.radv-vk]
driver = "radv"
suite = "deqp-vk"

[case.lvp-vk]
driver = "lvp"
suite = "deqp-vk"

# Piglit on radv through the zink layer (layers.toml).
[case.radv-zink-gl]
driver = "radv"
layer = "zink"
suite = "piglit"
