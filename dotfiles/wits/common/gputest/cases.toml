# A case is a driver × suite pair and the suite's groups it runs. It names the
# store directory, the state file and the comparison against the previous
# archive. Which cases run nightly is a services declaration
# (`gpu-test-run.cases`); the config only says what a case is.

[case.radv-vk]
driver = "radv"
suite = "deqp-vk"
groups = ["all"]

# lavapipe renders on the CPU, so it leaves out the some largest groups.
[case.lvp-vk]
driver = "lvp"
suite = "deqp-vk"
groups = [
    "buffer",
    "compute",
    "descriptor",
    "dynamic-state",
    "fragment",
    "modern-graphics",
    "ray-tracing",
    "render",
    "shader",
    "traditional-graphics",
]

# Piglit on radv through the zink layer (layers.toml).
[case.radv-zink-gl]
driver = "radv"
layer = "zink"
suite = "piglit"
groups = ["quick"]
