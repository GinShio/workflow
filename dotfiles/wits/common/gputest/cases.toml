# A case is the driver × suite pair that names the store directory, the state
# file and the comparison against the previous archive. Which cases run
# nightly is a services declaration (`gpu-test-run.cases`); the config only
# says what a case is.

[case.radv-vk]
driver = "radv"
suite = "deqp-vk"

[case.lvp-vk]
driver = "lvp"
suite = "deqp-vk"

# Piglit through zink on the radv build. Zink is a driver rather than a case
# env on radv: a GL test loads files a Vulkan test does not, and the files
# the identity hashes are a driver's.
[case.radv-zink-gl]
driver = "zink"
suite = "piglit"
