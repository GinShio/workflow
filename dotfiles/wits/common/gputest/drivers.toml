# A driver is the build under test, not a prefix: its environment is whatever
# `wits devenv` composes for that build, and `select` picks which ICD inside
# that environment the test loads, as `VK_LOADER_DRIVERS_SELECT`. The defaults
# name the nightly's build: release, on the project's main branch.
#
# `libs` and `config` list what a driver loads and reads besides its ICD; the
# identity hashes nothing else of the build. Mesa's drirc sets options only
# for the applications and engines it names. None of them is dEQP, so a driver
# lists its drirc only when one of its layers is named there.
#
# AMDVLK is a project only on the khronos3d overlay, so its driver and case are
# declared there.
{%@@ set mesa_src = projects.root_dir ~ '/' ~ wits.projects.source_info['mesa'].org ~ '/' ~ wits.projects.source_info['mesa'].name @@%}

[driver.radv]
project = "mesa"
select = "*radeon*"
# radv's drirc has `mesa zink` engine sections, which apply whenever the zink
# layer runs on radv. Mesa reads the files from the checkout at run time and
# radv's build only validates them, so editing one moves no library.
config = [
    "{{@@ mesa_src @@}}/src/amd/vulkan/00-radv-defaults.conf",
    "{{@@ mesa_src @@}}/src/amd/vulkan/01-radv-performance.conf",
]

[driver.lvp]
project = "mesa"
select = "*lvp*"
# lavapipe compiles every shader with the LLVM its ICD links. Named without
# its version, the entry follows whichever LLVM Mesa is built against.
libs = ["libLLVM.so"]
# Every lavapipe screen starts LP_NUM_THREADS rasterizer threads and as many
# compute threads, one per CPU by default (llvmpipe's lp_screen.c), while
# deqp-runner runs one dEQP process per job: one per physical core, under
# deqp-vk's jobs = "cores". Each process gets its share of the CPUs instead
# of all of them: online CPUs over physical cores, at least 1.
env = { LP_NUM_THREADS = "{{@@ [1, (sys_cpu_count | int) // ([1, sys_cpu_cores | int] | max)] | max @@}}" }
