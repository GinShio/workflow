# A suite is one runner invocation. Its project's install_dir is the suite
# root, so every path below is relative to that root; the `.deqp` or `.piglit`
# table names the runner shape.
#
# The caselist is the one deqp's install hook generates from the build tree's
# per-list files (`dotfiles/wits/common/project/install/deqp.sh`): vk-default
# without the api, image/swapchain-mutable, info, query-pool, video and wsi
# lists, which the hook leaves out deliberately. The per-list files themselves
# are not installed.

[suite.deqp-vk]
project = "deqp"
case_list = ["mustpass/vk-default.txt"]
jobs = "cores"
timeout = 300

[suite.deqp-vk.deqp]
exe = "deqp-vk"
waiver = "waivers/vk.xml"
args = [
    "--deqp-log-images=disable",
    "--deqp-log-shader-sources=disable",
    "--deqp-log-decompiled-spirv=disable",
    "--deqp-shadercache=disable",
]
tests_per_group = 4096

# Piglit's CMake install puts the test executables, the shared libraries and
# the framework under `${CMAKE_INSTALL_LIBDIR}/piglit`, which CMake resolves to
# lib64 on openSUSE for any prefix. PIGLIT_PLATFORM=gbm is the headless path;
# PYTHONDONTWRITEBYTECODE keeps a run from writing __pycache__ into the tree
# its install stamp hashes.
[suite.piglit]
project = "piglit"
case_list = ["quick"]
jobs = 4
timeout = 300

[suite.piglit.piglit]
folder = "lib64/piglit"

[suite.piglit.env]
PIGLIT_PLATFORM = "gbm"
PYTHONDONTWRITEBYTECODE = "1"
