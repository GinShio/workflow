# AMDVLK is a project only on this overlay. Its manifest is the one the
# project's devenv names under install_dir, so the composed environment already
# exposes exactly one ICD and the driver needs no `select`.

[driver.amdvlk]
project = "amdvlk"
env = { AMD_CONFIG_DIR = "{{@@ sysenv.amd_config_dir @@}}" }
config = ["{{@@ sysenv.amd_config_dir @@}}/amdVulkanSettings.cfg"]

[case.amdvlk-vk]
driver = "amdvlk"
suite = "deqp-vk"
groups = [
    "buffer",
    "compute",
    "descriptor",
    "fragment",
    "image",
    "modern-graphics",
    "pipeline",
    "ray-tracing",
    "shader",
]
