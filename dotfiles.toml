# Where everything is. Every path below is relative to this file's directory,
# which is what makes it the repository root.
#
# Generated Dotdrop inputs are local, ignored artifacts rebuilt immediately
# before deployment. Keeping the bundle below the composition table gives the
# bootstrap one private subtree whose permissions it can enforce.

[layout]
modules = 'dotfiles'
module_manifest = 'manifest.toml'
module_fragments = 'manifest'
composition = 'dotfiles/dotdrop/hosts.toml'
globals = 'dotfiles/dotdrop/globals.toml'
fragments = 'dotfiles/dotdrop/manifest'

[output]
dir = 'dotfiles/dotdrop'
entrypoint = '{plane}.{host}.toml'
variables = 'bundle/variables.toml'
actions = 'bundle/actions.toml'
overlay_variables = 'bundle/{overlay}/variables.toml'
