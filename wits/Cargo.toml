[workspace]
resolver = "2"
members = ["crates/wits-util", "crates/wits", "crates/wits-scaffold"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared dependency versions: members opt in with `<dep>.workspace = true`, so
# the version and feature set are declared once for the whole tree (including
# future plugin crates).
[workspace.dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# Shell completion scripts are generated from the clap tree, never maintained
# by hand, so a completion can never advertise a flag the CLI no longer has.
clap_complete = "4"
anyhow = "1"
thiserror = "2"
log = "0.4"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
argon2 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
base64 = "0.22"
rand = "0.8"
toml = "0.8"
tempfile = "3"
# The one template engine in the tree. `wits_util::template` wraps it for config
# resolution (lazy dotted paths over a context whose values are themselves
# templates) and the scaffold plugin adds its own filters to the same base, so a
# template reads the same wherever it is written.
minijinja = "2"
regex = "1"
# Unified diffs that `git apply` accepts. The edits are pure insertions at known
# offsets, but deriving hunk line numbers by hand across several insertions into
# one file is exactly the arithmetic a diff library already gets right.
similar = "3"
# Read-only DOM: vk.xml is navigated by element/attribute, never mutated.
roxmltree = "0.21"
wits-util = { path = "crates/wits-util" }
